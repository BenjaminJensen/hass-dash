# The house.
#
# One file: which rooms exist, what they are called, which entities back them,
# and what counts as comfortable in each. Replaces rooms.widget.yml, which
# mixed this up with pixel coordinates.
#
# Rooms appear on screen in the order they appear here. There is no `order`
# key and no `position` key; layout is computed from a box model.
#
# TODO(comfort): every band below is a placeholder chosen by the developer, not
# a number from the family. Red means "act", so until these are real, the red on
# this screen is guesswork - and the 2026-09-19 capture showed it is worse than
# guesswork: against these numbers EIGHT of the eleven rooms draw red, because
# the house sits at 64-75 % RH and 23-25 degrees. Red everywhere is red nowhere
# (INTENT.md section 2). See PLAN.md slice 2.3.
#
# Entity ids confirmed against the live instance on 2026-09-19 by
# `tools/capture_snapshot.py`: all 24 resolve. Re-run it after renaming
# anything in Home Assistant; tests/test_sources_fixture.py then fails here
# rather than on the wall.

weather:
  entity_id: weather.home

sun:
  entity_id: sun.sun

defaults:
  comfort:
    min_temperature: 19.0
    max_temperature: 24.0
    max_humidity: 60.0

rooms:
  - key: stue
    name: Stue
    climate: climate.0x5cc7c1fffede1ef5_2
    humidity: sensor.0x5cc7c1fffede1ef5_humidity_2

  - key: kokken
    name: Køkken
    climate: climate.0x5cc7c1fffede1ef5_6
    humidity: sensor.0x5cc7c1fffede1ef5_humidity_6

  - key: sovevaerelse
    name: Soveværelse
    climate: climate.0x5cc7c1fffede1ef5_1
    humidity: sensor.0x5cc7c1fffede1ef5_humidity_1
    # A bedroom is meant to be cooler than a living room.
    comfort:
      min_temperature: 17.0
      max_temperature: 22.0
      max_humidity: 60.0

  - key: stort_bad
    name: Stort bad
    climate: climate.0x5cc7c1fffede1ef5_5
    humidity: sensor.0x5cc7c1fffede1ef5_humidity_5
    # A bathroom is damp after a shower and that is not an alert. The ceiling
    # is here to catch air that never dries out.
    comfort:
      min_temperature: 20.0
      max_temperature: 26.0
      max_humidity: 70.0

  - key: lille_bad
    name: Lille bad
    climate: climate.0x5cc7c1fffede1ef5_7
    # Confirmed: "Lille Bad Danfoss". The old _humidity_8 was the wrong room.
    humidity: sensor.0x5cc7c1fffede1ef5_humidity_7
    comfort:
      min_temperature: 20.0
      max_temperature: 26.0
      max_humidity: 70.0

  - key: sune
    name: Sune
    climate: climate.0x5cc7c1fffede1ef5_4
    humidity: sensor.0x5cc7c1fffede1ef5_humidity_4
    comfort:
      min_temperature: 17.0
      max_temperature: 22.0
      max_humidity: 60.0

  - key: sophie
    name: Sophie
    climate: climate.0x5cc7c1fffede1ef5_8
    # Confirmed: _humidity_8 pairs with climate _8. The old _humidity_9 was
    # gang's sensor - this is the section 11 bug, now fixed.
    humidity: sensor.0x5cc7c1fffede1ef5_humidity_8
    comfort:
      min_temperature: 17.0
      max_temperature: 22.0
      max_humidity: 60.0

  - key: marius
    name: Marius
    climate: climate.0x5cc7c1fffede1ef5_3
    humidity: sensor.0x5cc7c1fffede1ef5_humidity_3
    comfort:
      min_temperature: 17.0
      max_temperature: 22.0
      max_humidity: 60.0

  - key: gang
    name: Gang
    climate: climate.0x5cc7c1fffede1ef5_9
    # Confirmed: _humidity_9 is gang's alone now that sophie reads _humidity_8.
    humidity: sensor.0x5cc7c1fffede1ef5_humidity_9

  - key: garage
    name: Garage
    climate: climate.0x5cc7c1fffede1ef5_10
    humidity: sensor.0x5cc7c1fffede1ef5_humidity_10
    # Cold is normal in a garage; freezing is not.
    comfort:
      min_temperature: 5.0
      max_humidity: 80.0

  - key: ude
    name: Ude
    is_outdoor: true
    # Reads the weather provider on purpose. A physical outdoor sensor does
    # exist - sensor.ude_sensor_ude_* - and it is broken: 23,2 degrees against
    # the forecast's 17,7, and a humidity pinned at exactly 100,0 since
    # 2026-09-09. Point these at it if it is ever repaired.
    temperature:
      entity_id: weather.home
      attribute: temperature
    humidity:
      entity_id: weather.home
      attribute: humidity
    # The outdoors has no comfort band. It is reported, not judged.
    comfort: {}
